<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tournesol</title>

<style>

/* ================= VARIABLES TYPO ================= */
:root {
    --h1-size: 2em;
    --h2-size: 1.1em;
    --p-size: 0.8em;
}

/* ================= GLOBAL ================= */
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    overflow: hidden;
}

h1 {
    font-size: var(--h1-size);
    margin: 10px;
}

h2 {
    font-size: var(--h2-size);
    margin: 5px 0;
    font-weight: normal;
}

p {
    font-size: var(--p-size);
}

/* ================= TITRE ================= */
#title {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
}

/* ================= CANVAS ================= */
canvas {
    display: block;
}

/* ================= PANNEAUX ================= */
.panel {
    position: fixed;
    top: 70px;
    background: rgba(20,20,20,0.85);
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
}

#historyPanel {
    left: 2em;
    width: 15%;
}

#scorePanel {
    right: 2em;
    width: 20%;
}

/* ================= HISTORIQUE ================= */
.historyItem {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    font-size: 1.5em;
}

/* ================= SCORE ================= */
#bigScore {
    font-size: var(--h1-size);
    font-weight: bold;
    text-align: center;
    margin: 10px 0;
}

.legendRow {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    font-size: 1.5em;
}

.dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
}

/* ================= CONTROLES ================= */
#controls {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.92);
    padding: 30px 15px 60px 15px; /* correction */
    text-align: center;
}

#angleValue {
    font-size: var(--h1-size);
    font-weight: bold;
}

/* SLIDER */
input[type=range] {
    width: 85%;
    height: 70px;
    margin-top: 10px;
}

/* ================= CONSIGNE ================= */
#consigneBox {
    position: fixed;
    bottom: 260px; /* remontée */
    left: 30px;
    max-width: 320px;
}

#consigneBox h2 {
    font-family: "Comic Sans MS", cursive;
}

/* ================= BOUTON BULLE ================= */
#goldenContainer {
    position: relative;
    width: 85%;
    margin: auto;
}

#goldenBtn {
    position: absolute;
    transform: translateX(-50%);
    font-size: var(--h2-size);
    padding: 10px 16px;
    border: none;
    border-radius: 12px;
    background: gold;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

/* pointe */
#goldenBtn::after {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 0 8px 10px 8px;
    border-style: solid;
    border-color: transparent transparent gold transparent;
}

</style>
</head>

<body>

<div id="title">
    <h1>Implantation des graines <br>du Tournesol 🌻</h1>
</div>

<canvas id="canvas"></canvas>

<div id="historyPanel" class="panel">
    <h2>Historique</h2>
    <div id="history"></div>
</div>

<div id="scorePanel" class="panel">
    <h2>Score global</h2>

    <div id="bigScore">-</div>

    <h2>Qualité de la disposition des graines:</h2>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(0,200,0)"></span>Optimale</span>
        <span id="v"></span>
    </div>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(255,220,0)"></span>Satisfaisante</span>
        <span id="j"></span>
    </div>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(255,140,0)"></span>Dégradée</span>
        <span id="o"></span>
    </div>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(255,0,0)"></span>Congestionnée</span>
        <span id="r"></span>
    </div>
</div>

<div id="consigneBox">
    <h2>
    Déplacez le curseur pour modifier l’angle d’implantation des graines et essayez de battre le nombre d’or !
    </h2>
</div>

<div id="controls">

<h2>
Angle : <span id="angleValue">0</span>°
</h2>

<div id="goldenContainer">
    <input type="range" id="slider" min="0" max="180" step="0.5" value="137">
    <button id="goldenBtn">Angle d'Or</button>
</div>

</div>

<script>

// ================= POSITION BOUTON =================
function positionGoldenButton(){
    const slider = document.getElementById("slider");
    const btn = document.getElementById("goldenBtn");

    const sliderRect = slider.getBoundingClientRect();
    const containerRect = slider.parentElement.getBoundingClientRect();

    const percent = 137.5 / 180;
    const x = percent * sliderRect.width;

    btn.style.left = (sliderRect.left - containerRect.left + x) + "px";
    btn.style.top = (slider.offsetHeight + 10) + "px";
}

window.addEventListener("resize", positionGoldenButton);
window.addEventListener("load", positionGoldenButton);

// ================= CANVAS =================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ================= VARIABLES =================
let angle = 0;
let points = [];
const maxPoints = 800;
const scale = 8;

let isRunning = false;
let history = [];
let currentScore = 0;

// ================= UI =================
const slider = document.getElementById("slider");
const angleValue = document.getElementById("angleValue");
const scoreBox = document.getElementById("bigScore");
const historyBox = document.getElementById("history");

const vBox = document.getElementById("v");
const jBox = document.getElementById("j");
const oBox = document.getElementById("o");
const rBox = document.getElementById("r");

const goldenBtn = document.getElementById("goldenBtn");

// ================= COULEURS =================
function colorFromScore(t){
    if(t >= 0.9) return "rgb(0,200,0)";
    else if(t >= 0.75) return "rgb(255,220,0)";
    else if(t >= 0.3) return "rgb(255,140,0)";
    else return "rgb(255,0,0)";
}

// ================= DIST =================
function dist(a,b){
    return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}

// ================= RESET =================
function reset(){
    points = [];
    isRunning = true;
}

// ================= HISTORIQUE =================
function addHistory(){
    history.unshift({angle, score: currentScore});
    if(history.length > 10) history.pop();

    historyBox.innerHTML = "";

    history.forEach(h => {
        let line = document.createElement("div");
        line.className = "historyItem";

        line.innerHTML =
        `<span>${h.angle.toFixed(1)}°</span>
         <span>${Math.round(h.score*100)}%</span>`;

        line.style.color = colorFromScore(h.score);
        historyBox.appendChild(line);
    });
}

// ================= INTERACTIONS =================
slider.oninput = function(){
    angle = parseFloat(this.value);
    angleValue.textContent = angle;
    reset();
};

goldenBtn.onclick = function(){
    angle = 137.5;
    slider.value = 137.5;
    angleValue.textContent = "137.5";
    reset();
};

// ================= UPDATE =================
function update(){

    if(points.length < maxPoints){

        let i = points.length;

        let cx = canvas.width / 2;
        let cy = canvas.height * 0.40;

        let r = Math.sqrt(i) * scale;
        let theta = i * angle * Math.PI / 180;

        let x = cx + r * Math.cos(theta);
        let y = cy + r * Math.sin(theta);

        let p = {x,y,score:1};

        let minD = Infinity;

        for(let o of points){
            let d = dist(p,o);
            if(d < minD) minD = d;
        }

        let t = minD / 13;
        t = Math.max(0,Math.min(1,t));

        p.score = t;
        points.push(p);
    }

    let total = 0, v=0,j=0,o=0,r=0;

    for(let p of points){
        total += p.score;

        if(p.score >= 0.9) v++;
        else if(p.score >= 0.75) j++;
        else if(p.score >= 0.3) o++;
        else r++;
    }

    currentScore = points.length ? total / points.length : 0;

    scoreBox.innerHTML = Math.round(currentScore*100) + "%";

    vBox.textContent = Math.round(v/points.length*100||0)+"%";
    jBox.textContent = Math.round(j/points.length*100||0)+"%";
    oBox.textContent = Math.round(o/points.length*100||0)+"%";
    rBox.textContent = Math.round(r/points.length*100||0)+"%";

    if(points.length === maxPoints && isRunning){
        addHistory();
        isRunning = false;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let p of points){
        ctx.fillStyle = colorFromScore(p.score);
        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
