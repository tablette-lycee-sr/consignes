<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Implantation des graines du Tournesol 🌱</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    overflow: hidden;
}

/* ================= TITRE ================= */
#title {
    position: fixed;
    top: 10px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

/* ================= CANVAS ================= */
canvas {
    display: block;
}

/* ================= PANNEAUX ================= */
.panel {
    position: fixed;
    top: 60px;
    background: rgba(20,20,20,0.85);
    padding: 12px;
    border-radius: 12px;
}

/* gauche (historique réduit d’1/3) */
#historyPanel {
    left: 10px;
    width: 160px;
    font-size: 14px;
}

/* droite */
#scorePanel {
    right: 10px;
    width: 240px;
    font-size: 18px;
}

/* ================= HISTORIQUE ================= */
.historyItem {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    margin: 4px 0;
}

/* ================= SCORE ================= */
#bigScore {
    font-size: 42px;
    font-weight: bold;
    margin: 10px 0;
}

.legendRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 3px 0;
    font-family: monospace;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
}

/* ================= CONTROLES ================= */
#controls {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: rgba(0,0,0,0.92);
    padding: 15px;
    text-align: center;
}

#angleValue {
    font-size: 42px;
    font-weight: bold;
}

input[type=range] {
    width: 85%;
    height: 45px;
    margin-top: 10px;
}

button {
    font-size: 24px;
    padding: 12px 18px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: gold;
    color: black;
    font-weight: bold;
}

/* consigne manuscrite */
#consigne {
    font-family: "Comic Sans MS", cursive;
    font-size: 16px;
    margin-top: 10px;
    opacity: 0.9;
}
</style>
</head>

<body>

<div id="title">Implantation des graines du Tournesol 🌻</div>

<canvas id="canvas"></canvas>

<!-- ================= HISTORIQUE ================= -->
<div id="historyPanel" class="panel">
    <b>Historique</b>
    <div id="history"></div>
</div>

<!-- ================= SCORE ================= -->
<div id="scorePanel" class="panel">
    <b>Score global</b>

    <div id="bigScore">-</div>

    <b>Niveau de congestion des graines</b>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(0,200,0)"></span>Vert</span>
        <span id="v"></span>
    </div>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(255,220,0)"></span>Jaune</span>
        <span id="j"></span>
    </div>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(255,140,0)"></span>Orange</span>
        <span id="o"></span>
    </div>

    <div class="legendRow">
        <span><span class="dot" style="background:rgb(255,0,0)"></span>Rouge</span>
        <span id="r"></span>
    </div>
</div>

<!-- ================= CONTROLES ================= -->
<div id="controls">

<div>
Angle : <span id="angleValue">137</span>°
</div>

<input type="range" id="slider" min="0" max="180" step="0.5" value="137">

<br>

<button id="goldenBtn">🌻 Angle d'or</button>

<div id="consigne">
Déplacez le curseur pour modifier l’angle d’implantation des nouvelles graines et essayez de battre le nombre d’or !
</div>

</div>

<script>

// ================= CANVAS =================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ================= VARIABLES =================
let angle = 137;
let points = [];
const maxPoints = 800;
const scale = 7; // 🔻 réduit comme demandé

let isRunning = false;
let history = [];
let currentScore = 0;

// ================= UI =================
const slider = document.getElementById("slider");
const angleValue = document.getElementById("angleValue");
const scoreBox = document.getElementById("bigScore");
const historyBox = document.getElementById("history");

const vBox = document.getElementById("v");
const jBox = document.getElementById("j");
const oBox = document.getElementById("o");
const rBox = document.getElementById("r");

const goldenBtn = document.getElementById("goldenBtn");

// ================= COULEURS =================
function colorFromScore(t){
    if(t >= 0.9) return "rgb(0,200,0)";
    else if(t >= 0.75) return "rgb(255,220,0)";
    else if(t >= 0.3) return "rgb(255,140,0)";
    else return "rgb(255,0,0)";
}

// ================= DIST =================
function dist(a,b){
    return Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);
}

// ================= RESET =================
function reset(){
    points = [];
    ctx.clearRect(0,0,canvas.width,canvas.height);
    isRunning = true;
}

// ================= HISTORIQUE =================
function addHistory(){

    history.unshift({
        angle: angle,
        score: currentScore
    });

    if(history.length > 10) history.pop();

    renderHistory();
}

function renderHistory(){

    historyBox.innerHTML = "";

    history.forEach(h => {

        let line = document.createElement("div");
        line.className = "historyItem";

        let pct = Math.round(h.score * 100);

        line.innerHTML =
            `<span>${h.angle.toFixed(1)}°</span>
             <span>${pct}%</span>`;

        line.style.color = colorFromScore(h.score);

        historyBox.appendChild(line);
    });
}

// ================= INTERACTIONS =================
slider.oninput = function(){
    angle = parseFloat(this.value);
    angleValue.textContent = angle;
    reset();
};

goldenBtn.onclick = function(){
    angle = 137.5;
    slider.value = 137.5;
    angleValue.textContent = "137.5";
    reset();
};

// ================= UPDATE =================
function update(){

    if(points.length < maxPoints){

        let i = points.length;

        let cx = canvas.width / 2;
        let cy = canvas.height * 0.40;

        let r = Math.sqrt(i) * scale;
        let theta = i * angle * Math.PI / 180;

        let x = cx + r * Math.cos(theta);
        let y = cy + r * Math.sin(theta);

        let p = {x,y,score:1};

        let minD = Infinity;

        for(let o of points){
            let d = dist(p,o);
            if(d < minD) minD = d;
        }

        let t = minD / 10;
        t = Math.max(0,Math.min(1,t));

        p.score = t;
        points.push(p);
    }

    // ================= SCORE =================
    let total = 0;
    let v=0,j=0,o=0,r=0;

    for(let p of points){
        total += p.score;

        if(p.score >= 0.9) v++;
        else if(p.score >= 0.75) j++;
        else if(p.score >= 0.3) o++;
        else r++;
    }

    currentScore = points.length ? total / points.length : 0;

    let pct = Math.round(currentScore * 100);

    scoreBox.innerHTML = `<b>${pct}%</b>`;

    vBox.textContent = Math.round(v/points.length*100 || 0) + "%";
    jBox.textContent = Math.round(j/points.length*100 || 0) + "%";
    oBox.textContent = Math.round(o/points.length*100 || 0) + "%";
    rBox.textContent = Math.round(r/points.length*100 || 0) + "%";

    // fin expérience
    if(points.length === maxPoints && isRunning){
        addHistory();
        isRunning = false;
    }

    // ================= DESSIN =================
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let p of points){
        ctx.fillStyle = colorFromScore(p.score);
        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(update);
}

update();

</script>

</body>
</html>
